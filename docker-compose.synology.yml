# Synology Deployment Configuration
# Usage:
# 1. Copy llm-memory-agent.tar to NAS
# 2. Load image: docker load -i llm-memory-agent.tar
# 3. Run: docker-compose up -d

version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    platform: linux/arm64  # Erzwingt ARM64 Version für Synology
    container_name: llm-memory-postgres
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ai_memory
      POSTGRES_USER: ${DB_USER:-postgres}
    ports:
      - "5433:5432"
    volumes:
      # Wichtig: Auf Synology /volume1 oder /volume2 verwenden, nicht /docker
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/1-init.sql
    networks:
      - llm-memory-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  agent:
    image: llm-memory-agent:latest
    platform: linux/arm64  # Wichtig für Synology RTD1619B
    container_name: llm-memory-agent
    environment:
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-changeme}@postgres:5432/ai_memory"  # Internal port, not exposed
      LLM_BASE_URL: "${LLM_BASE_URL:-http://localhost:11434}"
      LLM_PROVIDER: "${LLM_PROVIDER:-ollama}"
      LLM_MODEL: "${LLM_MODEL:-mistral:7b}"
      NODE_ENV: "${NODE_ENV:-production}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - agent_logs:/app/logs
    networks:
      - llm-memory-net
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  agent_logs:
    driver: local

networks:
  llm-memory-net:
    driver: bridge
